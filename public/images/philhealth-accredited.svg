<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <!-- Left: Stylized Family Figures -->
  <g transform="translate(60, 40)">
    <!-- Adult Parent Figure (Yellow-Gold) -->
    <!-- Head Sphere -->
    <defs>
      <radialGradient id="sphere-gray" cx="35%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#A0A0A0"/>
        <stop offset="60%" stop-color="#4B4B4B"/>
        <stop offset="100%" stop-color="#262626"/>
      </radialGradient>
      <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#E5A812"/>
        <stop offset="50%" stop-color="#F5B822"/>
        <stop offset="100%" stop-color="#C98F0A"/>
      </linearGradient>
      <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0B7A3E"/>
        <stop offset="50%" stop-color="#149450"/>
        <stop offset="100%" stop-color="#086131"/>
      </linearGradient>
    </defs>
    
    <circle cx="48" cy="28" r="26" fill="url(#sphere-gray)" />
    <!-- Adult Body -->
    <path d="M 18 68 L 78 68 L 78 185 L 18 185 Z" fill="url(#gold-grad)" />
    <!-- Arm reaching toward child -->
    <path d="M 70 100 L 98 115 L 98 135 L 70 120 Z" fill="#F5B822" />

    <!-- Child Figure (Green) -->
    <circle cx="126" cy="74" r="21" fill="url(#sphere-gray)" />
    <!-- Child Body -->
    <path d="M 102 106 L 150 106 L 150 185 L 102 185 Z" fill="url(#green-grad)" />
  </g>

  <!-- Right: PhilHealth Text Lockup -->
  <g transform="translate(240, 50)">
    <!-- Main PhilHealth Wordmark -->
    <text x="0" y="85" font-family="'Arial', 'Helvetica Neue', sans-serif" font-weight="900" font-size="74" fill="#141E28" letter-spacing="-1">
      Phil<tspan fill="#141E28">Health</tspan>
    </text>
    <!-- Tagline: Your Partner in Health -->
    <text x="35" y="132" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="34" fill="#374151" letter-spacing="0.5">
      Your Partner in Health
    </text>
  </g>

  <!-- Bottom: Green ACCREDITED Badge Bar -->
  <g transform="translate(45, 235)">
    <rect x="0" y="0" width="550" height="74" rx="20" fill="#0B7A3E" stroke="#086131" stroke-width="2"/>
    <!-- Subtle shine highlights on capsule -->
    <ellipse cx="60" cy="37" rx="36" ry="12" fill="#FFFFFF" opacity="0.18" />
    <ellipse cx="490" cy="37" rx="36" ry="12" fill="#FFFFFF" opacity="0.18" />
    <!-- Inner White Text -->
    <text x="275" y="52" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="8">ACCREDITED</text>
  </g>
</svg>
