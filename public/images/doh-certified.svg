<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- D -->
  <path d="M 65 65 L 140 65 C 185 65 210 92 210 142 C 210 192 185 220 140 220 L 65 220 Z M 105 100 L 105 185 L 136 185 C 162 185 170 170 170 142 C 170 115 162 100 136 100 Z" fill="#0A7C42" />

  <!-- DOH Official Center Seal (Serving as the "O") -->
  <g transform="translate(300, 142.5)">
    <!-- Outer Gold Ring -->
    <circle r="77" fill="#F4B41A" stroke="#C88E05" stroke-width="2"/>
    <circle r="72" fill="#0A7C42" />
    <circle r="70" fill="none" stroke="#F4B41A" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Circular Department Text Arc Representation -->
    <circle r="60" fill="#0E8A4A" stroke="#F4B41A" stroke-width="1"/>
    
    <!-- Inner White Core -->
    <circle r="46" fill="#FFFFFF"/>
    
    <!-- Philippine Shield (Blue / Red) -->
    <g transform="translate(0, -2)">
      <!-- Left Blue Half -->
      <path d="M -22 -20 L 0 -20 L 0 24 C -12 22 -22 10 -22 -2 Z" fill="#0038A8" />
      <!-- Right Red Half -->
      <path d="M 0 -20 L 22 -20 L 22 -2 C 22 10 12 22 0 24 Z" fill="#CE1126" />
      <!-- Top Sun/Stars & Golden Medical Staff -->
      <path d="M -3 -26 L 3 -26 L 2 28 L -2 28 Z" fill="#F4B41A" />
      <circle cx="0" cy="-28" r="5" fill="#F4B41A" />
      <!-- Serpents of Asclepius -->
      <path d="M -8 -16 Q 0 -12 8 -8 Q 0 -4 -8 0 Q 0 6 8 12" fill="none" stroke="#F4B41A" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="-14" cy="-14" r="2" fill="#FFFFFF" />
      <circle cx="14" cy="-14" r="2" fill="#FFFFFF" />
      <circle cx="0" cy="16" r="2" fill="#FFFFFF" />
    </g>
    
    <!-- Outer Seal Rim Decorative Dots -->
    <circle cx="0" cy="-66" r="2" fill="#FFFFFF"/>
    <circle cx="47" cy="-47" r="2" fill="#FFFFFF"/>
    <circle cx="66" cy="0" r="2" fill="#FFFFFF"/>
    <circle cx="47" cy="47" r="2" fill="#FFFFFF"/>
    <circle cx="0" cy="66" r="2" fill="#FFFFFF"/>
    <circle cx="-47" cy="47" r="2" fill="#FFFFFF"/>
    <circle cx="-66" cy="0" r="2" fill="#FFFFFF"/>
    <circle cx="-47" cy="-47" r="2" fill="#FFFFFF"/>
  </g>

  <!-- H -->
  <path d="M 390 65 L 430 65 L 430 122 L 500 122 L 500 65 L 540 65 L 540 220 L 500 220 L 500 162 L 430 162 L 430 220 L 390 220 Z" fill="#0A7C42" />

  <!-- CERTIFIED Text -->
  <text x="300" y="295" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" fill="#0A7C42" letter-spacing="7">CERTIFIED</text>
</svg>
